<!doctype html>
<html lang="en" class="scroll-smooth" style="background-color: #F6F6F6;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/seo/logo_normal.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>University of Calgary Debate Society (UCDS)</title>
    <meta name="description" content="Official web platform of the University of Calgary Debate Society (UCDS). Cultivating critical thought, persuasive discourse, and competitive excellence since 1966." />
    
    <!-- Google Fonts Preconnect & Stylesheet -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Theme Flash & Blank Screen Prevention (System / LocalStorage Sync) -->
    <script>
      (function() {
        try {
          var storedTheme = localStorage.getItem('ucds_theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = storedTheme === 'dark' || (!storedTheme && systemDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#15162C';
            if (document.body) document.body.style.backgroundColor = '#15162C';
            var meta = document.querySelector('meta[name="color-scheme"]');
            if (meta) meta.content = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#F6F6F6';
            if (document.body) document.body.style.backgroundColor = '#F6F6F6';
            var meta = document.querySelector('meta[name="color-scheme"]');
            if (meta) meta.content = 'light';
          }
          var storedAnim = localStorage.getItem('ucds_animations');
          var systemReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (storedAnim === 'false' || (storedAnim === null && systemReducedMotion)) {
            document.documentElement.classList.add('reduce-motion');
          }
        } catch (e) {}
      })();
    </script>

    <!-- GitHub Pages Single Page App Deep-Linking Redirection Handler -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body class="min-h-screen bg-[#F6F6F6] text-[#1C244C] dark:bg-[#15162C] dark:text-[#F6F6F6] transition-colors duration-300 antialiased selection:bg-[#0075A2] selection:text-white overflow-x-hidden font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
